<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c5f6e">
<title>Ortho Rounds — v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ════ 1 · tokens ════════════════════════════════════════ */
:root{
  --f-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Fraunces",Georgia,serif;
  --f-mono:"JetBrains Mono","SF Mono",Consolas,monospace;

  --t-11:11px; --t-12:12px; --t-13:13px; --t-14:14px;
  --t-16:16px; --t-19:19px; --t-23:23px; --t-30:30px;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:26px; --s-7:34px;

  --ink:#171d29; --ink-2:#525d72; --ink-3:#8992a3;
  --line:#e3e6ec; --line-2:#eef0f4;
  --paper:#f5f6f8; --card:#ffffff; --sunk:#fafbfc; --hover:#f1f3f6;
  --accent:#2c5f6e; --accent-2:#e6efef; --accent-3:#1f4a57; --on-accent:#ffffff;
  --bone:#f2ede3; --bone-line:#dcd3bd; --bone-ink:#75653f;
  --good:#3a7355; --good-bg:#e7f2eb;
  --warn:#98591f; --warn-bg:#fbefe0;
  --bad:#9e3838;  --bad-bg:#fae9e9;
  --film:#11151b; --film-in:rgba(0,0,0,.34);

  --r-sm:8px; --r:12px; --r-lg:16px; --r-chip:6px;
  --sh-1:0 1px 2px rgba(23,29,41,.05), 0 1px 3px rgba(23,29,41,.04);
  --sh-2:0 2px 6px rgba(23,29,41,.06), 0 6px 16px rgba(23,29,41,.07);
  --sh-3:0 12px 28px rgba(23,29,41,.12), 0 32px 60px rgba(23,29,41,.10);
  --ring:0 0 0 3px var(--accent-2);

  --ez:cubic-bezier(.32,.72,0,1);
  --sp:cubic-bezier(.34,1.38,.64,1);
  --d1:.16s; --d2:.28s; --d3:.44s;
  --rail:76px; --rail-x:214px;
}
[data-theme="dark"]{
  --ink:#e9eef5; --ink-2:#98a4b6; --ink-3:#69758a;
  --line:#1d2631; --line-2:#161e27;
  --paper:#06090d; --card:#0f161e; --sunk:#0a1017; --hover:#161f2a;
  --accent:#6fd3c7; --accent-2:#112a2d; --accent-3:#8ee2d7; --on-accent:#042320;
  --bone:#181d25; --bone-line:#28303b; --bone-ink:#b8a87e;
  --good:#5cbe8a; --good-bg:#0e2318;
  --warn:#dea15a; --warn-bg:#291d0d;
  --bad:#ef837d;  --bad-bg:#2b1214;
  --film:#05080b; --film-in:rgba(255,255,255,.055);
  --sh-1:0 1px 2px rgba(0,0,0,.55);
  --sh-2:0 3px 10px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.4);
  --sh-3:0 16px 36px rgba(0,0,0,.62), 0 40px 72px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(111,211,199,.22);
}

/* ════ 2 · base ══════════════════════════════════════════ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:var(--f-sans);font-size:var(--t-14);color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
  font-variant-numeric:tabular-nums;
  transition:background var(--d3) var(--ez),color var(--d3) var(--ez);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left;}
input,select,textarea{font:inherit;color:inherit;}
svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.ico{width:19px;height:19px;flex-shrink:0;display:block;}
.ico-s{width:15px;height:15px;flex-shrink:0;display:block;}
:focus{outline:none;}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
.mono{font-family:var(--f-mono);font-size:var(--t-12);letter-spacing:-.01em;}
.disp{font-family:var(--f-disp);font-weight:600;letter-spacing:-.022em;}
.lbl{font-size:var(--t-11);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 10px 2px;}
.lbl.mt{margin-top:var(--s-6);}
.muted{color:var(--ink-3);}

/* ════ 3 · shell ═════════════════════════════════════════ */
.app{height:100dvh;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr;position:relative;isolation:isolate;}
.rail{display:none;}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:760px){
  .app{grid-template-columns:var(--rail) 1fr;grid-template-rows:1fr;}
  .rail{display:flex;flex-direction:column;gap:2px;padding:var(--s-4) var(--s-2);
    background:var(--card);border-right:1px solid var(--line);align-items:center;}
  .nav{display:none!important;}
}
@media(min-width:1300px){
  .app{grid-template-columns:var(--rail-x) 1fr;}
  .rail{align-items:stretch;padding:var(--s-5) var(--s-3);}
}
.rl-brand{display:flex;align-items:center;gap:10px;padding:2px 6px var(--s-5);}
.rl-mk{width:31px;height:31px;border-radius:9px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;flex-shrink:0;font-family:var(--f-disp);font-weight:700;font-size:15px;}
.rl-tx{display:none;min-width:0;}
.rl-tx b{display:block;font-family:var(--f-disp);font-size:var(--t-14);font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.rl-tx span{font-size:var(--t-11);color:var(--ink-3);}
@media(min-width:1300px){.rl-tx{display:block;}}
.rl{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);
  font-size:var(--t-13);font-weight:500;width:100%;justify-content:center;
  transition:background var(--d1),color var(--d1);}
.rl-lb{display:none;white-space:nowrap;}
@media(min-width:1300px){.rl{justify-content:flex-start;}.rl-lb{display:block;}}
.rl:hover{background:var(--hover);color:var(--ink);}
.rl[aria-current="page"]{background:var(--accent-2);color:var(--accent);}
.rl-sp{flex:1;min-height:var(--s-4);}
.rl-div{height:1px;background:var(--line);margin:10px 4px;flex-shrink:0;}

/* header */
.hd{display:flex;align-items:center;gap:var(--s-3);padding:13px var(--s-4) 12px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--card);}
@media(min-width:760px){.hd{padding:15px var(--s-6) 14px;}}
.hd-ti{flex:1;min-width:0;}
.hd-ti b{display:block;font-family:var(--f-disp);font-size:var(--t-19);font-weight:600;
  letter-spacing:-.025em;line-height:1.2;}
.hd-ti span{font-size:var(--t-12);color:var(--ink-3);}
.hd-ac{display:flex;align-items:center;gap:6px;}
.ib{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);
  transition:background var(--d1),color var(--d1),transform var(--d1) var(--sp);}
.ib:hover{background:var(--hover);color:var(--ink);}
.ib:active{transform:scale(.9);}
.sync{display:none;align-items:center;gap:6px;font-size:var(--t-11);color:var(--good);
  background:var(--good-bg);padding:5px 10px;border-radius:20px;font-weight:500;}
@media(min-width:900px){.sync{display:flex;}}
.sync i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;}
.ringw{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.ring{width:35px;height:35px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round;}
.ring .bg{stroke:var(--line);}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .8s var(--ez);}
.ringw b{font-size:var(--t-13);font-weight:600;line-height:1.15;display:block;}
.ringw span{font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;}

/* spine */
.spine{display:flex;gap:4px;padding:10px var(--s-4);overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  background:var(--card);border-bottom:1px solid var(--line);scroll-behavior:smooth;}
.spine::-webkit-scrollbar{display:none;}
@media(min-width:760px){.spine{padding:10px var(--s-6);}}
.sp{flex-shrink:0;min-width:32px;height:37px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:var(--paper);border:1px solid var(--line);
  font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);
  transition:background var(--d2),color var(--d2),border-color var(--d2),transform var(--d2) var(--sp);}
.sp i{width:4px;height:4px;border-radius:50%;background:var(--line);display:block;transition:background var(--d2);}
.sp:hover{border-color:var(--accent);}
.sp.seen{background:var(--accent-2);border-color:transparent;color:var(--accent);}
.sp.seen i{background:var(--accent);}
.sp.flag i{background:var(--bad);}
.sp.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.12);}
.sp.now i{background:currentColor;}

/* panes */
.body{flex:1;min-height:0;display:flex;overflow:hidden;}
.view{display:none;flex:1;min-width:0;min-height:0;}
.view.on{display:flex;animation:vin var(--d3) var(--ez);}
@keyframes vin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.plist{width:100%;overflow-y:auto;overscroll-behavior:contain;padding:var(--s-4) var(--s-4) 104px;}
.pdet{display:none;}
@media(min-width:760px){.plist{padding:var(--s-4) var(--s-6) var(--s-6);}}
@media(min-width:1100px){
  .split .plist{width:352px;flex-shrink:0;border-right:1px solid var(--line);
    padding:var(--s-4) var(--s-4) var(--s-6);}
  .split .pdet{display:block;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;
    padding:var(--s-5) var(--s-6) var(--s-7);background:var(--sunk);}
}
.full{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--s-4) var(--s-4) 104px;}
@media(min-width:760px){.full{padding:var(--s-5) var(--s-6) var(--s-6);}}

/* ════ 4 · film ══════════════════════════════════════════ */
.fbox{background:var(--film);border-radius:10px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--film-in);transition:transform var(--d2) var(--sp);cursor:zoom-in;display:block;}
.fbox:hover{transform:scale(1.025);}
.fbox:active{transform:scale(.98);}
.fbox svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.fbox::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 66% 56% at 50% 42%,rgba(255,255,255,.08),transparent 72%);}
[data-theme="dark"] .fbox{box-shadow:inset 0 0 0 1px var(--film-in),0 0 26px rgba(140,190,220,.12);}
.fbox em{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;font-style:normal;
  color:#b9c3ce;background:rgba(0,0,0,.55);text-align:center;letter-spacing:.05em;z-index:1;}
.fnone{background:var(--bone);border:1px dashed var(--bone-line);border-radius:10px;
  display:grid;place-items:center;color:var(--bone-ink);}
.fnone .ico{width:26px;height:26px;opacity:.5;}

/* ════ 5 · hero ══════════════════════════════════════════ */
.hero{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-2);
  border:1px solid var(--line);overflow:hidden;animation:hin var(--d3) var(--ez);}
@keyframes hin{from{opacity:0;transform:translateX(18px) scale(.99);}to{opacity:1;transform:none;}}
.hero-lb{display:flex;align-items:center;gap:7px;padding:12px var(--s-4) 0;font-size:var(--t-11);
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.pls{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pl 2.2s ease-in-out infinite;}
@keyframes pl{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.68);}}
.hero-tp{display:flex;gap:var(--s-4);padding:12px var(--s-4) 14px;}
.hero-f{width:106px;flex-shrink:0;}
.hero-f .fbox,.hero-f .fnone{height:136px;}
.fcap{font-size:var(--t-11);color:var(--ink-3);text-align:center;margin-top:6px;}
.who{min-width:0;flex:1;}
.w-bed{font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);letter-spacing:.07em;}
.w-nm{font-family:var(--f-disp);font-size:var(--t-23);font-weight:600;letter-spacing:-.028em;
  line-height:1.12;margin:2px 0 4px;}
.w-mt{font-size:var(--t-12);color:var(--ink-2);}
.w-dx{font-size:var(--t-14);font-weight:500;margin-top:8px;line-height:1.34;}
.w-pr{font-size:var(--t-12);color:var(--ink-2);margin-top:3px;}

/* track */
.trk{margin:var(--s-5) var(--s-4) 0;}
.trk-r{position:relative;height:2px;background:var(--line);border-radius:2px;}
.trk-f{position:absolute;left:0;top:0;height:2px;background:var(--accent);border-radius:2px;
  transition:width .85s var(--ez);}
.st{position:absolute;top:50%;transform:translate(-50%,-50%);}
.st i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line);
  border:2px solid var(--card);box-sizing:content-box;transition:all var(--d3) var(--sp);}
.st.done i{background:var(--accent);}
.st.now i{background:var(--accent);width:11px;height:11px;box-shadow:0 0 0 4px var(--accent-2);}
.st.due i{background:var(--bad);}
.st b{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:var(--t-11);font-weight:500;color:var(--ink-3);}
.st.now b{color:var(--accent);font-weight:600;}
.st.due b{color:var(--bad);font-weight:600;}
.st:first-of-type b{left:0;transform:none;}
.st:last-of-type b{left:auto;right:0;transform:none;}
.trk-lg{height:23px;}

.flags{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--s-4);margin-top:10px;}
.fl{font-size:var(--t-11);font-weight:500;padding:4px 9px;border-radius:var(--r-chip);letter-spacing:.005em;}
.fl.bad{background:var(--bad-bg);color:var(--bad);}
.fl.warn{background:var(--warn-bg);color:var(--warn);}
.fl.ok{background:var(--good-bg);color:var(--good);}

.plan{margin:var(--s-4) var(--s-4) 0;}
.pin{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);
  padding:11px 12px;font-size:var(--t-14);outline:none;
  transition:border-color var(--d1),box-shadow var(--d1),background var(--d1);}
.pin::placeholder{color:var(--ink-3);}
.pin:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--card);}
.pyest{margin-top:8px;font-size:var(--t-11);color:var(--ink-3);line-height:1.5;}
.pyest button{color:var(--accent);font-weight:600;font-size:var(--t-11);}
.pyest button:hover{text-decoration:underline;}

.bar{display:flex;gap:9px;padding:var(--s-4);}
.btn{border-radius:var(--r-sm);padding:12px var(--s-4);font-size:var(--t-13);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  transition:transform var(--d1) var(--sp),background var(--d1),border-color var(--d1),color var(--d1);}
.btn:active{transform:scale(.965);}
.btn.pri{background:var(--accent);color:var(--on-accent);flex:1;}
.btn.pri:hover{background:var(--accent-3);}
.btn.gh{border:1px solid var(--line);color:var(--ink-2);background:var(--card);}
.btn.gh:hover{border-color:var(--accent);color:var(--accent);}
.btn.sq{flex:0 0 46px;padding:0;height:44px;}

/* rows */
.qr{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;width:100%;margin-bottom:7px;
  transition:transform var(--d1) var(--sp),box-shadow var(--d1),border-color var(--d1),opacity var(--d2);}
.qr:hover{box-shadow:var(--sh-1);transform:translateY(-1px);border-color:var(--ink-3);}
.qr[aria-current="true"]{border-color:var(--accent);background:var(--accent-2);}
.qr.seen{opacity:.46;}
.qr.seen:hover{opacity:.8;}
.qb{font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);width:22px;flex-shrink:0;}
.qm{width:27px;height:33px;border-radius:5px;background:var(--film);flex-shrink:0;position:relative;overflow:hidden;}
.qm.none{background:var(--bone);border:1px dashed var(--bone-line);}
.qm svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.qi{min-width:0;flex:1;}
.qn{font-size:var(--t-13);font-weight:500;display:block;}
.qs{font-size:var(--t-11);color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qt{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;flex-shrink:0;letter-spacing:.02em;}

/* ════ 6 · detail ════════════════════════════════════════ */
.dt-hd{display:flex;gap:var(--s-5);margin-bottom:var(--s-5);flex-wrap:wrap;}
.dt-gal{display:flex;gap:var(--s-2);flex-shrink:0;}
.dt-gal .fbox,.dt-gal .fnone{width:98px;height:128px;}
.dt-nm{font-family:var(--f-disp);font-size:var(--t-30);font-weight:600;letter-spacing:-.03em;line-height:1.08;margin:3px 0 0;}
.dt-sub{font-size:var(--t-13);color:var(--ink-2);margin-top:5px;}
.dt-dx{font-size:var(--t-16);font-weight:500;margin-top:11px;line-height:1.35;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s-4);margin-bottom:var(--s-3);}
.card:last-child{margin-bottom:0;}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s-3);align-items:start;}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s-3);}
.fld label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px;}
.fld div{font-size:var(--t-13);line-height:1.45;}
.ck{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2);
  font-size:var(--t-13);width:100%;transition:opacity var(--d2);}
.ck:last-child{border:0;padding-bottom:0;}
.ck-b{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line);flex-shrink:0;
  display:grid;place-items:center;color:transparent;
  transition:background var(--d2) var(--sp),border-color var(--d2),color var(--d2);}
.ck:hover .ck-b{border-color:var(--accent);}
.ck.done .ck-b{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.ck-b .ico-s{stroke-width:3;}
.ck span{flex:1;}
.ck.done span{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;}
.ck em{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);font-style:normal;flex-shrink:0;}
.ck.due em{color:var(--bad);font-weight:700;}
.hist{font-size:var(--t-12);color:var(--ink-2);padding:8px 0;border-bottom:1px solid var(--line-2);
  display:flex;gap:12px;line-height:1.5;}
.hist:last-child{border:0;padding-bottom:0;}
.hist b{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);flex-shrink:0;width:48px;font-weight:500;padding-top:1px;}
.empty{font-size:var(--t-13);color:var(--ink-3);padding:var(--s-3) 0;line-height:1.5;}

/* ════ 7 · board ═════════════════════════════════════════ */
.board{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);align-items:start;}
@media(min-width:1100px){.board{grid-template-columns:repeat(4,1fr);}}
.ch{display:flex;align-items:baseline;gap:7px;margin-bottom:10px;padding-left:2px;}
.ch b{font-size:var(--t-11);letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.ch span{font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);}
.tile{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 11px;margin-bottom:7px;width:100%;
  transition:transform var(--d1) var(--sp),box-shadow var(--d1);}
.tile:hover{transform:translateX(2px);box-shadow:var(--sh-1);}
.tile-t{display:flex;align-items:baseline;gap:6px;}
.tile-t b{font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);font-weight:500;}
.tile-t span{font-size:var(--t-13);font-weight:500;}
.tile-s{font-size:var(--t-11);color:var(--ink-3);margin-top:3px;display:block;line-height:1.4;}

/* ════ 8 · tables & docs ═════════════════════════════════ */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);}
.tbl{width:100%;border-collapse:collapse;min-width:640px;}
.tbl th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap;}
.tbl td{padding:12px 14px;font-size:var(--t-13);border-bottom:1px solid var(--line-2);}
.tbl tr:last-child td{border:0;}
.tbl tbody tr:hover td{background:var(--sunk);}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;margin-bottom:var(--s-4);}
.inp{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:9px 12px;
  font-size:var(--t-13);outline:none;transition:border-color var(--d1),box-shadow var(--d1);}
.inp:focus{border-color:var(--accent);box-shadow:var(--ring);}
.note{font-size:var(--t-12);color:var(--ink-3);margin-top:var(--s-4);line-height:1.55;max-width:64ch;}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s-6);max-width:680px;}
.sheet h3{font-family:var(--f-disp);font-size:var(--t-19);font-weight:600;margin:0 0 4px;letter-spacing:-.02em;}
.sh-meta{font-size:var(--t-12);color:var(--ink-3);margin-bottom:var(--s-5);padding-bottom:var(--s-4);border-bottom:1px solid var(--line);}
.ho{padding:12px 0;border-bottom:1px solid var(--line-2);}
.ho:last-of-type{border:0;}
.ho-t{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.ho-t b{font-family:var(--f-mono);font-size:var(--t-11);color:var(--ink-3);font-weight:500;}
.ho-t strong{font-size:var(--t-14);font-weight:600;}
.ho-t em{font-size:var(--t-11);color:var(--ink-2);font-style:normal;}
.ho-p{font-size:var(--t-13);color:var(--ink-2);margin-top:5px;line-height:1.55;}
.ho-f{display:inline-block;font-size:var(--t-11);font-weight:600;color:var(--bad);background:var(--bad-bg);
  padding:3px 8px;border-radius:5px;margin-top:6px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s-4);}
.stat b{display:block;font-family:var(--f-mono);font-size:var(--t-30);font-weight:700;line-height:1.1;}
.tree{font-family:var(--f-mono);font-size:var(--t-12);line-height:2.1;color:var(--ink-2);}

/* ════ 9 · complete ══════════════════════════════════════ */
.done{padding:var(--s-7) var(--s-3);text-align:center;animation:din .7s var(--sp);}
@keyframes din{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
.dring{width:108px;height:108px;margin:0 auto var(--s-5);transform:rotate(-90deg);}
.dring circle{fill:none;stroke-width:4;stroke-linecap:round;}
.dring .bg{stroke:var(--line);}
.dring .fg{stroke:var(--accent);stroke-dasharray:301;stroke-dashoffset:301;animation:dr 1.35s .2s var(--ez) forwards;}
@keyframes dr{to{stroke-dashoffset:0;}}
.done h2{font-family:var(--f-disp);font-size:var(--t-30);font-weight:600;letter-spacing:-.028em;margin:0;}
.done p{font-size:var(--t-14);color:var(--ink-2);margin:10px 0 0;line-height:1.6;}
.dstats{display:flex;justify-content:center;gap:var(--s-7);margin-top:var(--s-6);flex-wrap:wrap;}
.dstat b{display:block;font-family:var(--f-mono);font-size:var(--t-23);font-weight:700;}
.dstat span{font-size:10px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;}

/* ════ 10 · nav ══════════════════════════════════════════ */
.nav{display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-top:1px solid var(--line);padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:20;}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--ink-3);
  font-size:10px;font-weight:600;letter-spacing:.02em;
  transition:color var(--d1),transform var(--d1) var(--sp);}
.nv .ico{width:21px;height:21px;}
.nv[aria-current="page"]{color:var(--accent);}
.nv.add{color:var(--accent);}
.nv:active{transform:scale(.88);}

/* ════ 11 · overlays ═════════════════════════════════════ */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.52);backdrop-filter:blur(5px);z-index:40;
  opacity:0;pointer-events:none;transition:opacity var(--d2);}
.scrim.on{opacity:1;pointer-events:auto;}
.pal{position:fixed;left:50%;top:72px;transform:translate(-50%,-12px) scale(.975);
  width:min(580px,calc(100vw - 24px));background:var(--card);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);border:1px solid var(--line);overflow:hidden;z-index:41;
  opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ez),transform var(--d3) var(--sp);}
.pal.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto;}
.pal-in{display:flex;align-items:center;gap:11px;padding:14px var(--s-4);border-bottom:1px solid var(--line);}
.pal-in input{flex:1;border:0;outline:none;background:none;font-size:var(--t-16);}
.pal-in input::placeholder{color:var(--ink-3);}
.kbd{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;line-height:1.5;}
.pal-l{max-height:min(430px,56vh);overflow-y:auto;padding:6px;scroll-behavior:smooth;}
.pal-g{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 9px 5px;}
.pi{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);width:100%;
  transition:background var(--d1);}
.pi:hover,.pi.sel{background:var(--accent-2);}
.pi-ic{width:27px;height:27px;border-radius:7px;background:var(--paper);display:grid;place-items:center;
  flex-shrink:0;color:var(--ink-2);transition:color var(--d1);}
.pi:hover .pi-ic,.pi.sel .pi-ic{color:var(--accent);}
.pi-t{font-size:var(--t-13);font-weight:500;flex:1;min-width:0;}
.pi-h{font-size:10px;color:var(--ink-3);font-family:var(--f-mono);flex-shrink:0;}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.975);
  width:min(540px,calc(100vw - 24px));max-height:86vh;overflow-y:auto;background:var(--card);
  border-radius:var(--r-lg);box-shadow:var(--sh-3);border:1px solid var(--line);z-index:41;
  opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ez),transform var(--d3) var(--sp);}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
.md-h{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line);}
.md-h h3{margin:0;font-family:var(--f-disp);font-size:var(--t-19);font-weight:600;flex:1;letter-spacing:-.02em;}
.md-b{padding:var(--s-5);}
.md-f{display:flex;gap:9px;justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--line);}
.frow{margin-bottom:var(--s-3);}
.frow label{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px;}
.frow input,.frow select{width:100%;border:1px solid var(--line);background:var(--paper);
  border-radius:var(--r-sm);padding:10px 12px;font-size:var(--t-14);outline:none;
  transition:border-color var(--d1),box-shadow var(--d1);}
.frow input:focus,.frow select:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--card);}
.smart{background:var(--accent-2);border-radius:var(--r-sm);padding:12px 13px;font-size:var(--t-12);
  color:var(--accent);margin-bottom:var(--s-4);display:flex;gap:10px;align-items:flex-start;line-height:1.5;}

/* viewer */
.viewer{position:fixed;inset:0;background:rgba(4,7,11,.95);z-index:55;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:var(--s-5);}
.viewer.on{display:flex;animation:vin var(--d2) var(--ez);}
.vw-f{width:min(78vw,440px);height:min(66vh,570px);background:#05080b;border-radius:var(--r);
  position:relative;overflow:hidden;box-shadow:0 0 90px rgba(150,200,230,.14),inset 0 0 0 1px rgba(255,255,255,.07);}
.vw-f svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.vw-c{display:flex;align-items:center;gap:var(--s-5);margin-top:var(--s-5);}
.vw-b{width:42px;height:42px;border-radius:50%;border:1px solid #1e2a38;color:#8fa0b3;
  display:grid;place-items:center;transition:background var(--d1),color var(--d1);}
.vw-b:hover{background:#111a24;color:#e2eaf2;}
.vw-t{color:#8fa0b3;font-size:var(--t-13);text-align:center;min-width:130px;}
.vw-t b{display:block;color:#e2eaf2;font-weight:600;}
.vw-x{position:absolute;top:var(--s-5);right:var(--s-5);color:#8fa0b3;width:40px;height:40px;
  border-radius:50%;display:grid;place-items:center;transition:background var(--d1),color var(--d1);}
.vw-x:hover{background:#111a24;color:#e2eaf2;}

/* present */
.present{position:fixed;inset:0;background:#04070a;z-index:60;display:none;flex-direction:column;
  padding:min(5vh,40px) min(5vw,48px);}
.present.on{display:flex;animation:vin .5s var(--ez);}
.pr-t{display:flex;align-items:center;justify-content:space-between;color:#465873;font-size:var(--t-11);
  letter-spacing:.18em;text-transform:uppercase;font-weight:600;}
.pr-b{flex:1;display:flex;align-items:center;gap:min(5vw,46px);flex-wrap:wrap;min-height:0;padding:var(--s-5) 0;}
.pr-f{width:min(28vw,250px);height:min(44vh,322px);background:#080c11;border-radius:14px;flex-shrink:0;
  position:relative;overflow:hidden;box-shadow:0 0 84px rgba(150,200,230,.14),inset 0 0 0 1px rgba(255,255,255,.07);}
.pr-f svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.pr-f.none{background:#0b0f15;display:grid;place-items:center;color:#2f3d4f;}
.pr-i{min-width:min(100%,280px);flex:1;}
.pr-bd{font-family:var(--f-mono);font-size:var(--t-13);color:#5b6e85;letter-spacing:.12em;}
.pr-n{font-family:var(--f-disp);font-size:clamp(30px,5.4vw,58px);font-weight:600;color:#f2f6fa;
  letter-spacing:-.035em;line-height:1.02;margin:8px 0 14px;}
.pr-d{font-size:clamp(16px,2.1vw,23px);color:#bbc8d6;line-height:1.34;}
.pr-p{font-size:var(--t-14);color:#67798d;margin-top:8px;}
.pr-pod{display:inline-block;margin-top:var(--s-5);font-family:var(--f-mono);font-size:var(--t-13);
  font-weight:700;color:#7fe0d2;border:1px solid rgba(127,224,210,.3);border-radius:8px;
  padding:7px 14px;letter-spacing:.08em;}
.pr-pl{border-top:1px solid #141d28;margin-top:var(--s-6);padding-top:var(--s-4);color:#8fa0b3;
  font-size:var(--t-16);line-height:1.55;}
.pr-pl b{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#465873;margin-bottom:8px;}
.pr-nv{display:flex;gap:10px;flex-shrink:0;}
.pr-btn{border:1px solid #18232f;color:#8fa0b3;border-radius:9px;padding:11px 20px;
  font-size:var(--t-13);font-weight:600;transition:background var(--d1),color var(--d1);}
.pr-btn:hover{background:#0f1821;color:#dde7f1;}

.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);background:var(--ink);
  color:var(--paper);font-size:var(--t-12);font-weight:500;padding:10px 17px;border-radius:22px;
  z-index:70;opacity:0;pointer-events:none;transition:all var(--d2) var(--sp);white-space:nowrap;
  box-shadow:var(--sh-2);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;}
@media(min-width:760px){.toast{bottom:28px;}}
.toast.on{opacity:1;transform:translate(-50%,0);}

@media print{
  .rail,.nav,.hd,.spine,.toolbar,.scrim,.pal,.modal,.present,.viewer,.toast{display:none!important;}
  body,.app,.main,.body,.view,.full{overflow:visible!important;height:auto!important;display:block!important;background:#fff!important;}
  .sheet,.tw{border:0!important;box-shadow:none!important;padding:0!important;max-width:none!important;}
}

  <div class="fld"><label>Surgeon</label><div>${esc(p.surgeon)}</div></div>
  <div class="fld"><label>Unit</label><div>${esc(p.unit)}</div></div>
  <div class="fld" style="grid-column:span 2"><label>Implant</label><div>${esc(p.implant)}</div></div>
  <div class="fld" style="grid-column:span 2"><label>Latest labs</label><div class="mono">${esc(p.labs)}</div></div></div></div>`;
}
const doneOf=()=>`<div class="done"><svg class="dring" viewBox="0 0 108 108" aria-hidden="true">
 <circle class="bg" cx="54" cy="54" r="48"/><circle class="fg" cx="54" cy="54" r="48"/></svg>
 <h2>Round complete</h2><p>All ${P.length} patients seen and planned.<br>Handover is ready to send.</p>
 <div class="dstats"><div class="dstat"><b>${P.length}</b><span>seen</span></div>
 <div class="dstat"><b>26</b><span>minutes</span></div><div class="dstat"><b>3</b><span>flagged</span></div></div>
 <div style="display:flex;gap:9px;justify-content:center;margin-top:var(--s-6);flex-wrap:wrap">
 <button class="btn pri" style="flex:0 0 auto" data-go="handover">Open handover</button>
 <button class="btn gh" data-reset="1">Start again</button></div></div>`;

/* ── views ── */
function rSpine(){
 $('#spine').innerHTML=P.map((p,i)=>`<button class="sp ${i===S.idx?'now':''} ${S.seen.has(i)?'seen':''} ${badOf(p)?'flag':''}"
  data-open="${i}" role="tab" aria-selected="${i===S.idx}" aria-label="Bed ${p.bed}, ${esc(p.name)}">${esc(p.bed)}<i></i></button>`).join('');
 $('#ringFg').style.strokeDashoffset=97.4*(1-S.seen.size/P.length);
 $('#ringN').textContent=`${S.seen.size}/${P.length}`;
 const n=$('#spine .sp.now');n?.scrollIntoView?.({block:'nearest',inline:'center'});
}
function rRound(){
 const all=S.seen.size===P.length;
 if(wide()){
  $('#roundList').innerHTML=`<p class="lbl">The round · ${S.seen.size} of ${P.length} seen</p>`+P.map((_,i)=>rowOf(i,i===S.idx)).join('');
  $('#roundDet').innerHTML=all?doneOf():detailOf(S.idx)+
   `<div style="display:flex;gap:9px;margin-top:var(--s-3)"><button class="btn pri" style="flex:0 0 auto" data-seen="1">Seen — next patient</button>
    <button class="btn gh" data-skip="1">Skip for now</button></div>`;
 }else{
  if(all){$('#roundList').innerHTML=doneOf();$('#roundDet').innerHTML='';return;}
  const nx=[];for(let k=1;k<=P.length&&nx.length<3;k++){const i=(S.idx+k)%P.length;if(!S.seen.has(i))nx.push(i);}
  $('#roundList').innerHTML=heroOf(S.idx)+(nx.length?`<p class="lbl mt">Up next</p>`+nx.map(i=>rowOf(i)).join(''):'');
  $('#roundDet').innerHTML='';
 }
}
function rBoard(){
 const cols=[['preop','Pre-op','var(--accent)'],['postop','Post-op','var(--ink-2)'],
  ['conservative','Conservative','var(--bone-ink)'],['discharge','For discharge','var(--good)']];
 $('#board').innerHTML=cols.map(([k,l,c])=>{
  const list=P.map((p,i)=>[p,i]).filter(([p])=>p.status===k);
  return `<div><div class="ch"><b style="color:${c}">${l}</b><span>${list.length}</span></div>
  ${list.length?list.map(([p,i])=>{const bad=badOf(p);
   return `<button class="tile" data-open="${i}" style="border-left-color:${bad?'var(--bad)':c}">
    <span class="tile-t"><b>${esc(p.bed)}</b><span>${esc(p.name)}</span></span>
    <span class="tile-s" style="${bad?'color:var(--bad)':''}">${esc(bad?bad[1]:(p.pod!=null?'POD '+p.pod:p.dx))}</span></button>`;}).join('')
   :`<p class="empty" style="padding-left:2px">None</p>`}</div>`;}).join('');
}
function workItems(){const o=[];P.forEach((p,i)=>p.flags.forEach(([k,t])=>{if(k!=='ok')o.push([i,k,t]);}));
 return o.sort((a,b)=>(a[1]==='bad'?0:1)-(b[1]==='bad'?0:1));}
function rWork(){
 const it=workItems();if(S.work>=it.length)S.work=0;
 const grp=(k,l)=>{const g=it.map((x,n)=>[x,n]).filter(([x])=>x[1]===k);
  return g.length?`<p class="lbl ${k==='warn'?'mt':''}">${l}</p>`+g.map(([[i,kk,t],n])=>{const p=P[i];
   return `<button class="qr" data-work="${n}" ${n===S.work?'aria-current="true"':''}>
    <span class="qb">${esc(p.bed)}</span><span class="qi"><span class="qn">${esc(t)}</span>
    <span class="qs">${esc(p.name)} · ${esc(p.dx)}</span></span>
    <span class="qt" style="background:var(--${kk}-bg);color:var(--${kk})">${kk==='bad'?'urgent':'today'}</span></button>`;}).join(''):'';};
 $('#workList').innerHTML=(grp('bad','Urgent — do now')+grp('warn','Today'))||`<p class="empty">Nothing outstanding. Good ward.</p>`;
 $('#workDet').innerHTML=it[S.work]?detailOf(it[S.work][0]):'';
}
function rOT(){$('#otP').innerHTML=`<div class="toolbar">
 <input class="inp" type="date" value="2026-08-02" aria-label="OT date">
 <button class="btn gh" data-toast="Word file generated">Download Word</button>
 <button class="btn gh" data-print="1">Print / PDF</button>
 <button class="btn gh" data-toast="Default doctors saved">Default doctors</button></div>
 <div class="tw"><table class="tbl"><thead><tr><th>#</th><th>Bed</th><th>Name</th><th>Age/Sex</th><th>Diagnosis</th><th>Procedure</th><th>Surgeon</th><th>Time</th></tr></thead>
 <tbody>${OTL.map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td><td style="font-weight:500">${esc(r[2])}</td>
 <td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td class="mono">${r[7]}</td></tr>`).join('')}</tbody></table></div>
 <p class="note">Formatted to the hospital OT list template. The Word export preserves the header block and signature lines, so it can go straight to theatre.</p>`;}
function rHand(){$('#hoP').innerHTML=`<div class="toolbar">
 <button class="btn pri" style="flex:0 0 auto" data-toast="Handover copied to clipboard">Copy for WhatsApp</button>
 <button class="btn gh" data-toast="Word file generated">Download Word</button>
 <button class="btn gh" data-print="1">Print</button></div>
 <div class="sheet"><h3>Unit II — evening handover</h3>
 <p class="sh-meta">Sunday 2 August, 18:30 · ${P.length} inpatients · handed to Dr A. Verma</p>
 ${P.map(p=>{const bad=badOf(p);return `<div class="ho"><div class="ho-t"><b>${esc(p.bed)}</b>
  <strong>${esc(p.name)}</strong><em>${esc(p.age)} · ${p.pod!=null?'POD '+p.pod:esc(p.stat)}</em></div>
  <p class="ho-p">${esc(p.dx)} — ${esc(p.plan||p.hist[0]?.[1]||'plan not entered')}</p>
  ${bad?`<span class="ho-f">${esc(bad[1])}</span>`:''}</div>`;}).join('')}
 <p class="note" style="margin-top:var(--s-4)">Generated from today's plans and open flags. Edit before sending.</p></div>`;}
function rDisch(){$('#dcP').innerHTML=`<div class="toolbar">
 <input class="inp" placeholder="Search discharged patients…" style="min-width:260px" aria-label="Search discharged"></div>
 <div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Age/Sex</th><th>Diagnosis</th><th>Procedure</th><th>Discharged</th><th>Stay</th></tr></thead>
 <tbody>${DC.map(r=>`<tr><td style="font-weight:500">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td>
 <td>${esc(r[3])}</td><td>${esc(r[4])}</td><td class="mono">${esc(r[5])}</td></tr>`).join('')}</tbody></table></div>`;}
function rAdmin(){$('#adP').innerHTML=`<div class="g4" style="margin-bottom:var(--s-4)">
 ${[['Organisations',1],['Departments',4],['Units',9],['People',37]].map(([l,v])=>
  `<div class="stat"><p class="lbl" style="margin-bottom:6px">${l}</p><b>${v}</b></div>`).join('')}</div>
 <p class="lbl">People</p>
 <div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Scope</th><th>Last active</th><th>Status</th></tr></thead><tbody>
 ${[['Dr S. Menon','Consultant','Ortho · Unit II','2 min ago','Active'],
    ['Dr A. Verma','Registrar','Ortho · Unit II','14 min ago','Active'],
    ['Dr K. Pillai','PG year 2','Ortho · Unit II · Ward 3','1 h ago','Active'],
    ['Dr N. Das','PG year 1','Ortho · Unit II · Ward 3','3 h ago','Active'],
    ['Sr. M. Joseph','Nurse','Ward 3','—','Invited']].map(r=>{const ok=r[4]==='Active';
  return `<tr><td style="font-weight:500">${esc(r[0])}</td><td>${esc(r[1])}</td>
  <td class="mono" style="font-size:11px">${esc(r[2])}</td><td>${esc(r[3])}</td>
  <td><span class="qt" style="background:var(--${ok?'good':'warn'}-bg);color:var(--${ok?'good':'warn'})">${esc(r[4])}</span></td></tr>`;}).join('')}</tbody></table></div>
 <p class="lbl mt">Structure</p><div class="card"><div class="tree">Sunrise Ortho Hospital<br>
 &nbsp;&nbsp;└ Orthopaedics<br>&nbsp;&nbsp;&nbsp;&nbsp;├ Unit I <span class="muted">— 2 wards</span><br>
 &nbsp;&nbsp;&nbsp;&nbsp;├ Unit II <span style="color:var(--accent)">— Ward 3 · Ward 5</span><br>
 &nbsp;&nbsp;&nbsp;&nbsp;└ Unit III <span class="muted">— 1 ward</span></div></div>`;}

/* ── palette ── */
function rPal(q=''){
 const t=q.trim().toLowerCase();let h='';S.palRows=[];
 const add=(html,fn)=>{S.palRows.push(fn);return html;};
 if(t){
  const pm=P.map((p,i)=>[p,i]).filter(([p])=>(p.name+' '+p.bed+' '+p.dx).toLowerCase().includes(t));
  if(pm.length)h+=`<p class="pal-g">Patients</p>`+pm.map(([p,i])=>add(
   `<button class="pi" data-prow="${S.palRows.length}"><span class="pi-ic">${ic('user')}</span>
    <span class="pi-t">${esc(p.name)}</span><span class="pi-h">bed ${esc(p.bed)}</span></button>`,
   ()=>{openPatient(i);closePal();})).join('');
  const am=ACT.filter(a=>a[1].toLowerCase().includes(t));
  if(am.length)h+=`<p class="pal-g">Actions</p>`+am.map(a=>add(
   `<button class="pi" data-prow="${S.palRows.length}"><span class="pi-ic">${ic(a[4])}</span>
    <span class="pi-t">${esc(a[1])}</span><span class="pi-h">${esc(a[3])}</span></button>`,
   ()=>runAct(a))).join('');
  if(!S.palRows.length)h=`<p class="pal-g">No match for “${esc(q.trim())}”</p>`;
 }else{
  ['Most used','Documents','Ward','Settings'].forEach(g=>{
   h+=`<p class="pal-g">${g}</p>`+ACT.filter(a=>a[0]===g).map(a=>add(
    `<button class="pi" data-prow="${S.palRows.length}"><span class="pi-ic">${ic(a[4])}</span>
     <span class="pi-t">${esc(a[1])}</span><span class="pi-h">${esc(a[3])}</span></button>`,
    ()=>runAct(a))).join('');});
 }
 $('#palL').innerHTML=h;S.palSel=0;markPal();
}
function markPal(){const r=$$('#palL .pi');r.forEach((e,n)=>e.classList.toggle('sel',n===S.palSel));
 r[S.palSel]?.scrollIntoView?.({block:'nearest'});}
function runAct(a){
 const k=a[2];closePal();
 if(k==='present'){S.pr=0;rPresent();$('#present').classList.add('on');}
 else if(k==='dark')setTheme(document.documentElement.dataset.theme!=='dark');
 else if(TITLE[k])go(k);
 else toast(a[1]+' — coming from the real build');
}

/* ── present & viewer ── */
function rPresent(){const p=P[S.pr];
 $('#prC').textContent=`${S.pr+1} of ${P.length}`;
 $('#prB').innerHTML=`<div class="pr-f ${p.films[0]?'':'none'}">${p.films[0]?F[p.films[0]]:ic('img')}</div>
 <div class="pr-i"><div class="pr-bd">BED ${esc(p.bed)}</div><h2 class="pr-n">${esc(p.name)}</h2>
 <p class="pr-d">${esc(p.dx)}</p><p class="pr-p">${esc(p.age)} · ${esc(p.proc)}</p>
 <div class="pr-pod">${p.pod!=null?'POST-OP DAY '+p.pod:esc(p.stat.toUpperCase())}</div>
 <div class="pr-pl"><b>Plan</b>${esc(p.plan||p.hist[0]?.[1]||'—')}</div></div>`;}
function openViewer(pi,k){
 const list=P[pi].films.length?P[pi].films:[k];
 S.vwP=list;S.vwI=Math.max(0,list.indexOf(k));rViewer();$('#viewer').classList.add('on');}
function rViewer(){const k=S.vwP[S.vwI];
 $('#vwF').innerHTML=F[k];
 $('#vwT').innerHTML=`<b>${esc(FL[k]||'Film')}</b>${S.vwI+1} of ${S.vwP.length}`;}

/* ── actions ── */
function setTheme(d){document.documentElement.dataset.theme=d?'dark':'light';
 toast(d?'Reading room on':'Reading room off');}
function openPatient(i){S.idx=i;if(S.view!=='round')go('round');else{rSpine();rRound();}}
function advance(){S.seen.add(S.idx);
 for(let k=1;k<=P.length;k++){const c=(S.idx+k)%P.length;if(!S.seen.has(c)){S.idx=c;break;}}
 rSpine();rRound();}
function skip(){for(let k=1;k<=P.length;k++){const c=(S.idx+k)%P.length;if(!S.seen.has(c)){S.idx=c;break;}}
 rSpine();rRound();toast('Skipped — still on the list');}
function go(v){
 if(!TITLE[v])return;S.view=v;
 $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 $$('.rl,.nv').forEach(b=>{const m=b.dataset.go===v;
  if(m)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 const[t,s]=TITLE[v];$('#hT').textContent=t;$('#hS').textContent=dateStr+' · '+s;
 const r=v==='round';$('#spine').style.display=r?'':'none';$('#ringW').style.display=r?'':'none';
 ({round:()=>{rSpine();rRound();},ward:rBoard,work:rWork,ot:rOT,handover:rHand,disch:rDisch,admin:rAdmin}[v])();
}
const openPal=()=>{$('#pal').classList.add('on');$('#scrim').classList.add('on');
 $('#palIn').value='';rPal();setTimeout(()=>$('#palIn').focus(),80);};
const closePal=()=>{$('#pal').classList.remove('on');$('#scrim').classList.remove('on');};
const closeAll=()=>{closePal();$('#addM').classList.remove('on');$('#scrim').classList.remove('on');
 $('#present').classList.remove('on');$('#viewer').classList.remove('on');};

/* ── events ── */
document.addEventListener('click',e=>{
 const t=e.target;
 const f=t.closest('[data-film]');if(f){const[pi,k]=f.dataset.film.split(':');openViewer(+pi,k);return;}
 if(t.closest('[data-vclose]')){$('#viewer').classList.remove('on');return;}
 const vn=t.closest('[data-vnav]');if(vn){if(!S.vwP?.length)return;
  S.vwI=(S.vwI+ +vn.dataset.vnav+S.vwP.length)%S.vwP.length;rViewer();return;}
 const pn=t.closest('[data-pnav]');if(pn){S.pr=(S.pr+ +pn.dataset.pnav+P.length)%P.length;rPresent();return;}
 if(t.closest('[data-pclose]')){$('#present').classList.remove('on');return;}
 const pr=t.closest('[data-prow]');if(pr){S.palRows[+pr.dataset.prow]?.();return;}
 const w=t.closest('[data-work]');if(w){S.work=+w.dataset.work;rWork();return;}
 const o=t.closest('[data-open]');if(o){openPatient(+o.dataset.open);closePal();return;}
 const ck=t.closest('[data-ck]');if(ck){const[i,n]=ck.dataset.ck.split(':').map(Number);
  P[i].checks[n][2]=P[i].checks[n][2]?0:1;S.view==='work'?rWork():rRound();toast('Milestone updated');return;}
 const dc=t.closest('[data-dc]');if(dc){const[i,n]=dc.dataset.dc.split(':').map(Number);
  P[i].dc[n][1]=P[i].dc[n][1]?0:1;S.view==='work'?rWork():rRound();toast('Checklist updated');return;}
 if(t.closest('[data-seen]')){advance();toast('Marked seen');return;}
 if(t.closest('[data-skip]')){skip();return;}
 const cp=t.closest('[data-copy]');if(cp){const i=+cp.dataset.copy;P[i].plan=P[i].hist[0]?.[1]||'';
  S.view==='work'?rWork():rRound();toast("Yesterday's plan copied");return;}
 if(t.closest('[data-reset]')){S.seen.clear();S.idx=0;rSpine();rRound();return;}
 if(t.closest('[data-add]')){closeAll();toast('Patient added to the ward');return;}
 if(t.closest('[data-print]')){print();return;}
 const ts=t.closest('[data-toast]');if(ts){toast(ts.dataset.toast);return;}
 if(t.closest('[data-close]')||t.id==='scrim'){closeAll();return;}
 const g=t.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const a=t.closest('[data-act]');if(a){const k=a.dataset.act;
  if(k==='pal')$('#pal').classList.contains('on')?closePal():openPal();
  else if(k==='add'){$('#addM').classList.add('on');$('#scrim').classList.add('on');}
  return;}
 if(t.closest('#themeBtn'))setTheme(document.documentElement.dataset.theme!=='dark');
});
document.addEventListener('input',e=>{
 if(e.target.id==='palIn'){rPal(e.target.value);return;}
 const p=e.target.dataset.plan;if(p!==undefined)P[+p].plan=e.target.value;
});
document.addEventListener('keydown',e=>{
 const palOn=$('#pal').classList.contains('on');
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOn?closePal():openPal();return;}
 if(e.key==='Escape'){closeAll();return;}
 if(palOn){
  if(e.key==='ArrowDown'){e.preventDefault();S.palSel=Math.min(S.palSel+1,S.palRows.length-1);markPal();}
  if(e.key==='ArrowUp'){e.preventDefault();S.palSel=Math.max(S.palSel-1,0);markPal();}
  if(e.key==='Enter'){e.preventDefault();S.palRows[S.palSel]?.();}
  return;}
 if($('#viewer').classList.contains('on')&&S.vwP?.length){
  if(e.key==='ArrowRight'){S.vwI=(S.vwI+1)%S.vwP.length;rViewer();}
  if(e.key==='ArrowLeft'){S.vwI=(S.vwI-1+S.vwP.length)%S.vwP.length;rViewer();}
  return;}
 if($('#present').classList.contains('on')){
  if(e.key==='ArrowRight'){S.pr=(S.pr+1)%P.length;rPresent();}
  if(e.key==='ArrowLeft'){S.pr=(S.pr-1+P.length)%P.length;rPresent();}
  return;}
 if(e.target?.matches?.('input,select,textarea'))return;
 if(e.shiftKey&&e.key==='P'){S.pr=0;rPresent();$('#present').classList.add('on');}
 if(e.shiftKey&&e.key==='D')setTheme(document.documentElement.dataset.theme!=='dark');
 if(e.shiftKey&&e.key==='H')go('handover');
});
let rz,lastWide=wide();
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
 if(wide()!==lastWide){lastWide=wide();if(S.view==='round')rRound();}},150);});

const dateStr=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';
go('round');rPal();
</script>
</body>
</html>
