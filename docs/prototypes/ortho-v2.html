<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ortho Rounds — v2 full prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --ink:#1c2230; --ink-soft:#5a6478; --ink-faint:#8b94a5;
  --line:#e2e5eb; --line-soft:#eef0f4;
  --paper:#f4f5f7; --card:#ffffff; --sunk:#fafbfc;
  --accent:#2c5f6e; --accent-soft:#e7f0f0; --on-accent:#ffffff;
  --bone:#f1ece2; --bone-line:#d8cfb8; --bone-ink:#796943;
  --good:#3d7959; --good-bg:#e8f3ec;
  --warn:#9f5e28; --warn-bg:#fbf0e2;
  --bad:#a33d3d;  --bad-bg:#faeaea;
  --film-bg:#12161c; --film-frame:rgba(0,0,0,.35);
  --radius:14px; --radius-sm:9px; --radius-chip:6px;
  --shadow-sm:0 1px 2px rgba(28,34,48,.05),0 1px 4px rgba(28,34,48,.04);
  --shadow-md:0 4px 14px rgba(28,34,48,.09),0 2px 4px rgba(28,34,48,.04);
  --shadow-lg:0 18px 44px rgba(28,34,48,.17);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
}
[data-theme="dark"]{
  --ink:#e8edf4; --ink-soft:#9aa6b8; --ink-faint:#6d798d;
  --line:#1e2732; --line-soft:#18202a;
  --paper:#080b0f; --card:#101720; --sunk:#0b1119;
  --accent:#6fd3c7; --accent-soft:#122b2e; --on-accent:#04211f;
  --bone:#1a1f27; --bone-line:#2a323d; --bone-ink:#b9a97f;
  --good:#5fc08d; --good-bg:#0f2419;
  --warn:#e0a35c; --warn-bg:#2a1e0e;
  --bad:#f0857f;  --bad-bg:#2c1315;
  --film-bg:#070a0e; --film-frame:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 6px 18px rgba(0,0,0,.55);
  --shadow-lg:0 22px 52px rgba(0,0,0,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:var(--font-sans);color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .5s var(--ease),color .5s var(--ease);}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
input,select,textarea{font-family:inherit;color:inherit;}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ico{width:19px;height:19px;flex-shrink:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ══ shell ══ */
.app{height:100dvh;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr;position:relative;}
.rail{display:none;}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);}

@media(min-width:760px){
  .app{grid-template-columns:76px 1fr;grid-template-rows:1fr;}
  .rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;
    background:var(--card);border-right:1px solid var(--line);}
  .nav{display:none;}
}
@media(min-width:1280px){
  .app{grid-template-columns:212px 1fr;}
  .rail{align-items:stretch;padding:18px 12px;}
}

.rl-brand{display:flex;align-items:center;gap:9px;padding:2px 6px 18px;}
.rl-mk{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;flex-shrink:0;font-family:var(--font-display);font-weight:600;font-size:14px;}
.rl-tx{display:none;min-width:0;}
@media(min-width:1280px){.rl-tx{display:block;}}
.rl-tx b{display:block;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.01em;}
.rl-tx span{font-size:10.5px;color:var(--ink-faint);}
.rl{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-soft);
  font-size:13px;font-weight:500;transition:background .18s,color .18s;width:100%;justify-content:center;}
@media(min-width:1280px){.rl{justify-content:flex-start;}}
.rl-lb{display:none;}
@media(min-width:1280px){.rl-lb{display:block;}}
.rl:hover{background:var(--line-soft);color:var(--ink);}
.rl.on{background:var(--accent-soft);color:var(--accent);}
.rl-sp{flex:1;}
.rl-div{height:1px;background:var(--line);margin:10px 4px;}

/* ══ header ══ */
.hd{display:flex;align-items:center;gap:14px;padding:13px 16px 11px;flex-shrink:0;
  border-bottom:1px solid var(--line);background:var(--card);}
@media(min-width:760px){.hd{padding:15px 22px 13px;}}
.hd-ti{flex:1;min-width:0;}
.hd-ti b{display:block;font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.hd-ti span{font-size:11.5px;color:var(--ink-faint);}
.hd-ac{display:flex;align-items:center;gap:7px;}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft);
  transition:background .18s,color .18s,transform .18s var(--spring);}
.ib:hover{background:var(--line-soft);color:var(--ink);}
.ib:active{transform:scale(.9);}
.ring{width:34px;height:34px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round;}
.ring .bg{stroke:var(--line);}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .75s var(--ease);}
.ringw{display:flex;align-items:center;gap:9px;}
.ringw b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;display:block;}
.ringw span{font-size:10px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase;}
.pill-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink-soft);transition:all .18s;}
.pill-btn:hover{border-color:var(--accent);color:var(--accent);}
.pill-btn kbd{font-family:var(--mono);font-size:10px;color:var(--ink-faint);}

/* ══ spine ══ */
.spine{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  background:var(--card);border-bottom:1px solid var(--line);}
@media(min-width:760px){.spine{padding:10px 22px;}}
.spine::-webkit-scrollbar{display:none;}
.sp{flex-shrink:0;min-width:31px;height:36px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:var(--paper);border:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);transition:all .26s var(--spring);}
.sp .d{width:4px;height:4px;border-radius:50%;background:var(--line);transition:background .26s;}
.sp.seen{background:var(--accent-soft);border-color:transparent;color:var(--accent);}
.sp.seen .d{background:var(--accent);}
.sp.flag .d{background:var(--bad);}
.sp.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.13);}
.sp.now .d{background:currentColor;}

/* ══ panes ══ */
.body{flex:1;min-height:0;display:flex;overflow:hidden;}
.pane-list{width:100%;overflow-y:auto;padding:14px 16px 96px;}
.pane-det{display:none;}
@media(min-width:760px){.pane-list{padding:16px 22px 24px;}}
@media(min-width:1100px){
  .split .pane-list{width:344px;flex-shrink:0;border-right:1px solid var(--line);padding:14px 14px 24px;}
  .split .pane-det{display:block;flex:1;min-width:0;overflow-y:auto;padding:20px 26px 40px;background:var(--sunk);}
}
.full{flex:1;overflow-y:auto;padding:16px 16px 96px;}
@media(min-width:760px){.full{padding:20px 22px 30px;}}
.view{display:none;flex:1;min-height:0;}
.view.on{display:flex;animation:vi .34s var(--ease);}
@keyframes vi{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

.lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;margin:0 0 9px 2px;}
.lbl.mt{margin-top:20px;}

/* ══ hero (mobile round) ══ */
.hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-md);
  border:1px solid var(--line);overflow:hidden;animation:sw .44s var(--ease);}
@keyframes sw{from{opacity:0;transform:translateX(22px) scale(.986);}to{opacity:1;transform:none;}}
.hero-lb{display:flex;align-items:center;gap:7px;padding:11px 15px 0;font-size:10.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.pls{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pl 2.1s ease-in-out infinite;}
@keyframes pl{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
.hero-tp{display:flex;gap:14px;padding:11px 15px 13px;}

/* film */
.film{width:104px;flex-shrink:0;}
.fbox{height:132px;background:var(--film-bg);border-radius:10px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--film-frame);transition:transform .3s var(--spring);}
.fbox:active{transform:scale(.97);}
.fbox svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.fbox::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 68% 58% at 50% 42%,rgba(255,255,255,.075),transparent 72%);}
.fnone{height:132px;background:var(--bone);border:1px dashed var(--bone-line);border-radius:10px;
  display:grid;place-items:center;color:var(--bone-ink);}
.fnone svg{width:28px;height:28px;opacity:.55;}
.fcap{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:6px;}

.who{min-width:0;flex:1;}
.w-bed{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;}
.w-nm{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.14;margin:1px 0 3px;}
.w-mt{font-size:12.5px;color:var(--ink-soft);}
.w-dx{font-size:14px;font-weight:500;margin-top:6px;line-height:1.32;}
.w-pr{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* track */
.trk{margin:15px 15px 0;}
.trk-r{position:relative;height:2px;background:var(--line);border-radius:2px;}
.trk-f{position:absolute;left:0;top:0;height:2px;background:var(--accent);border-radius:2px;transition:width .8s var(--ease);}
.st{position:absolute;top:50%;transform:translate(-50%,-50%);}
.st i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line);
  border:2px solid var(--card);box-sizing:content-box;transition:all .4s var(--spring);}
.st.done i{background:var(--accent);}
.st.now i{background:var(--accent);width:11px;height:11px;box-shadow:0 0 0 4px var(--accent-soft);}
.st.due i{background:var(--bad);}
.st b{position:absolute;top:13px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:500;color:var(--ink-faint);}
.st.now b{color:var(--accent);font-weight:600;}
.st.due b{color:var(--bad);font-weight:600;}
.trk-lg{height:22px;}

.flags{display:flex;flex-wrap:wrap;gap:6px;padding:0 15px;margin-top:8px;}
.fl{font-size:11px;font-weight:500;padding:4px 9px;border-radius:var(--radius-chip);}
.fl.bad{background:var(--bad-bg);color:var(--bad);}
.fl.warn{background:var(--warn-bg);color:var(--warn);}
.fl.ok{background:var(--good-bg);color:var(--good);}

.plan{margin:13px 15px 0;}
.pin{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);
  padding:11px 12px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;}
.pin::placeholder{color:var(--ink-faint);}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--card);}
.pyest{margin-top:7px;font-size:11.5px;color:var(--ink-faint);}
.pyest button{color:var(--accent);font-weight:600;}

.bar{display:flex;gap:9px;padding:14px 15px 15px;}
.btn{border-radius:var(--radius-sm);padding:12px 16px;font-size:13.5px;font-weight:600;
  transition:transform .18s var(--spring),background .2s,border-color .2s;}
.btn:active{transform:scale(.965);}
.btn.pri{background:var(--accent);color:var(--on-accent);flex:1;}
.btn.gh{border:1px solid var(--line);color:var(--ink-soft);}
.btn.gh:hover{border-color:var(--accent);color:var(--accent);}
.btn.sq{flex:0 0 46px;display:grid;place-items:center;padding:0;}

/* rows */
.qr{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;text-align:left;width:100%;margin-bottom:7px;
  transition:transform .2s var(--spring),box-shadow .2s,border-color .2s;}
.qr:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.qr.on{border-color:var(--accent);background:var(--accent-soft);}
.qr.seen{opacity:.5;}
.qb{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);width:21px;flex-shrink:0;}
.qm{width:26px;height:32px;border-radius:5px;background:var(--film-bg);flex-shrink:0;position:relative;overflow:hidden;}
.qm.none{background:var(--bone);border:1px dashed var(--bone-line);}
.qm svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.qi{min-width:0;flex:1;}
.qn{font-size:13.5px;font-weight:500;}
.qs{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qt{font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;flex-shrink:0;}

/* detail pane */
.dt-hd{display:flex;gap:16px;margin-bottom:20px;}
.dt-gal{display:flex;gap:8px;flex-shrink:0;}
.dt-f{width:96px;height:124px;background:var(--film-bg);border-radius:9px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--film-frame);transition:transform .25s var(--spring);}
.dt-f:hover{transform:scale(1.03);}
.dt-f svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.dt-f span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;color:#b6c0cb;
  background:rgba(0,0,0,.5);text-align:center;letter-spacing:.04em;}
.dt-nm{font-family:var(--font-display);font-size:29px;font-weight:600;letter-spacing:-.025em;line-height:1.1;}
.dt-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.dt-dx{font-size:16px;font-weight:500;margin-top:10px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;}
.fld label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:3px;}
.fld div{font-size:13.5px;}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.ck:last-child{border:0;}
.ck-b{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);flex-shrink:0;display:grid;place-items:center;transition:all .2s var(--spring);}
.ck.done .ck-b{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.ck.done span{color:var(--ink-faint);text-decoration:line-through;}
.ck-b svg{width:11px;height:11px;stroke-width:3;opacity:0;transition:opacity .2s;}
.ck.done .ck-b svg{opacity:1;}
.ck-p{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--ink-faint);}
.ck.due .ck-p{color:var(--bad);font-weight:700;}
.hist{font-size:12.5px;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:11px;}
.hist b{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex-shrink:0;width:52px;font-weight:500;}

/* board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
@media(min-width:1100px){.board{grid-template-columns:repeat(4,1fr);}}
.ch{display:flex;align-items:baseline;gap:7px;margin-bottom:9px;}
.ch b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;}
.ch span{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
.tile{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 11px;margin-bottom:7px;width:100%;
  text-align:left;transition:transform .2s var(--spring),box-shadow .2s;}
.tile:hover{transform:translateX(2px);box-shadow:var(--shadow-sm);}
.tile-t{display:flex;align-items:baseline;gap:6px;}
.tile-t b{font-family:var(--mono);font-size:11px;color:var(--ink-faint);font-weight:500;}
.tile-t span{font-size:13px;font-weight:500;}
.tile-s{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* table */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);background:var(--sunk);}
.tbl td{padding:11px 13px;font-size:13px;border-bottom:1px solid var(--line-soft);}
.tbl tr:last-child td{border:0;}
.tbl tr:hover td{background:var(--sunk);}
.mono{font-family:var(--mono);font-size:12px;}
.tbwrap{overflow-x:auto;}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.inp{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

/* handover sheet */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;max-width:660px;}
.sheet h3{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 3px;}
.sheet .meta{font-size:12px;color:var(--ink-faint);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.ho{padding:11px 0;border-bottom:1px solid var(--line-soft);}
.ho-t{display:flex;align-items:baseline;gap:8px;}
.ho-t b{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-weight:500;}
.ho-t strong{font-size:14px;font-weight:600;}
.ho-t em{font-size:11.5px;color:var(--ink-soft);font-style:normal;}
.ho-p{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.ho-f{display:inline-block;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg);padding:2px 7px;border-radius:5px;margin-top:5px;}

/* done */
.done{padding:56px 12px;text-align:center;animation:di .7s var(--spring);}
@keyframes di{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
.dring{width:104px;height:104px;margin:0 auto 22px;transform:rotate(-90deg);}
.dring circle{fill:none;stroke-width:4;stroke-linecap:round;}
.dring .bg{stroke:var(--line);}
.dring .fg{stroke:var(--accent);stroke-dasharray:295;stroke-dashoffset:295;animation:dr 1.3s .18s var(--ease) forwards;}
@keyframes dr{to{stroke-dashoffset:0;}}
.done h2{font-family:var(--font-display);font-size:27px;font-weight:600;letter-spacing:-.02em;margin:0;}
.done p{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.55;}
.dstats{display:flex;justify-content:center;gap:30px;margin-top:26px;}
.dstat b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;}
.dstat span{font-size:10.5px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase;}

/* nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 93%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:20;}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink-faint);
  font-size:10.5px;font-weight:500;transition:color .2s,transform .2s var(--spring);}
.nv .ico{width:21px;height:21px;}
.nv.on,.nv.add{color:var(--accent);}
.nv:active{transform:scale(.88);}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);backdrop-filter:blur(4px);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .3s;}
.scrim.on{opacity:1;pointer-events:auto;}
.pal{position:fixed;left:50%;top:70px;transform:translate(-50%,-14px) scale(.97);width:min(560px,calc(100vw - 24px));
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--line);
  overflow:hidden;z-index:41;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .34s var(--spring);}
.pal.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto;}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line);}
.pal-in input{flex:1;border:0;outline:none;background:none;font-size:15px;}
.pal-in input::placeholder{color:var(--ink-faint);}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:2px 5px;}
.pal-l{max-height:min(420px,58vh);overflow-y:auto;padding:6px;}
.pal-g{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:9px 9px 5px;}
.pi{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);width:100%;text-align:left;transition:background .14s;}
.pi:hover{background:var(--accent-soft);}
.pi-ic{width:26px;height:26px;border-radius:7px;background:var(--paper);display:grid;place-items:center;flex-shrink:0;color:var(--ink-soft);}
.pi:hover .pi-ic{color:var(--accent);}
.pi-ic .ico{width:15px;height:15px;}
.pi-t{font-size:13.5px;font-weight:500;flex:1;}
.pi-h{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(520px,calc(100vw - 24px));
  max-height:84vh;overflow-y:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  border:1px solid var(--line);z-index:41;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .34s var(--spring);}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
.md-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);}
.md-h h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:600;flex:1;}
.md-b{padding:18px;}
.md-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);}
.frow{margin-bottom:13px;}
.frow label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:5px;}
.frow input,.frow select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;outline:none;}
.frow input:focus,.frow select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.smart{background:var(--accent-soft);border-radius:var(--radius-sm);padding:11px 13px;font-size:12.5px;color:var(--accent);margin-bottom:15px;display:flex;gap:9px;align-items:flex-start;}

/* present */
.present{position:fixed;inset:0;background:#05080c;z-index:60;display:none;flex-direction:column;padding:min(5vh,38px) min(5vw,42px);}
.present.on{display:flex;animation:vi .5s var(--ease);}
.pr-t{display:flex;align-items:center;justify-content:space-between;color:#4a5b6e;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;}
.pr-b{flex:1;display:flex;align-items:center;gap:min(5vw,40px);flex-wrap:wrap;}
.pr-f{width:min(30vw,240px);height:min(42vh,304px);background:#0a0e13;border-radius:13px;flex-shrink:0;position:relative;overflow:hidden;
  box-shadow:0 0 70px rgba(150,200,230,.12),inset 0 0 0 1px rgba(255,255,255,.07);}
.pr-f svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;}
.pr-i{min-width:260px;flex:1;}
.pr-bd{font-family:var(--mono);font-size:13px;color:#5f7286;letter-spacing:.1em;}
.pr-n{font-family:var(--font-display);font-size:clamp(30px,5.2vw,54px);font-weight:600;color:#f0f4f8;letter-spacing:-.03em;line-height:1.03;margin:6px 0 12px;}
.pr-d{font-size:clamp(16px,2vw,22px);color:#b9c6d4;line-height:1.35;}
.pr-p{font-size:15px;color:#6d7f92;margin-top:7px;}
.pr-pod{display:inline-block;margin-top:18px;font-family:var(--mono);font-size:14px;font-weight:700;color:#7fe0d2;border:1px solid rgba(127,224,210,.32);border-radius:7px;padding:6px 13px;letter-spacing:.05em;}
.pr-pl{border-top:1px solid #16202b;margin-top:22px;padding-top:16px;color:#8fa0b3;font-size:16px;line-height:1.5;}
.pr-pl b{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4a5b6e;margin-bottom:7px;}
.pr-nv{display:flex;gap:10px;margin-top:16px;}
.pr-btn{border:1px solid #1c2836;color:#93a4b7;border-radius:9px;padding:11px 20px;font-size:13.5px;font-weight:600;transition:background .2s,color .2s;}
.pr-btn:hover{background:#111a24;color:#dce6f0;}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);background:var(--ink);color:var(--paper);
  font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:22px;z-index:70;opacity:0;pointer-events:none;
  transition:all .3s var(--spring);white-space:nowrap;}
@media(min-width:760px){.toast{bottom:28px;}}
.toast.on{opacity:1;transform:translate(-50%,0);}
</style>

  <div class="pr-d">${esc(p.dx)}</div><div class="pr-p">${esc(p.age)} · ${esc(p.proc)}</div>
  <div class="pr-pod">${p.pod!=null?'POST-OP DAY '+p.pod:p.stat.toUpperCase()}</div>
  <div class="pr-pl"><b>Plan</b>${esc(p.plan||p.hist[0]?.[1]||'—')}</div></div>`;
}
function go(v){
 view=v;
 $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
 $$('.rl,.nv').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
 const[t,s]=TITLES[v]||['',''];$('#hTitle').textContent=t;$('#hSub').textContent=s;
 $('#spine').style.display=v==='round'?'':'none';
 $('#ringWrap').style.display=v==='round'?'':'none';
 ({ward:renderBoard,work:renderWork,ot:renderOT,handover:renderHandover,disch:renderDisch,admin:renderAdmin,round:renderRound}[v]||(()=>{}))();
}
function openPal(o){$('#pal').classList.toggle('on',o);$('#scrim').classList.toggle('on',o);
 if(o){$('#palIn').value='';renderPal();setTimeout(()=>$('#palIn').focus(),90);}}
function openAdd(o){$('#addModal').classList.toggle('on',o);$('#scrim').classList.toggle('on',o);}
function setTheme(d){document.documentElement.setAttribute('data-theme',d?'dark':'light');toast(d?'Reading room on':'Reading room off');}
function advance(){seen.add(idx);let n=idx;
 for(let k=1;k<=P.length;k++){const c=(idx+k)%P.length;if(!seen.has(c)){n=c;break;}}
 idx=n;renderSpine();renderRound();}

document.addEventListener('click',e=>{
 const w=e.target.closest('[data-work]');if(w)workSel=+w.dataset.work;
 const j=e.target.closest('[data-jump]');
 if(j){idx=+j.dataset.jump;
  if(view==='work'){renderWork();openPal(false);return;}
  if(view!=='round')go('round');renderSpine();renderRound();
  if(j.closest('.pal'))openPal(false);return;}
 if(e.target.closest('[data-seen]')){advance();toast('Marked seen');return;}
 if(e.target.closest('[data-skip]')){let n=idx;
  for(let k=1;k<=P.length;k++){const c=(idx+k)%P.length;if(!seen.has(c)){n=c;break;}}
  idx=n;renderSpine();renderRound();toast('Skipped — still on the list');return;}
 if(e.target.closest('[data-copy]')){const i=$('#planIn');i.value=P[idx].hist[0]?.[1]||'';P[idx].plan=i.value;i.focus();toast("Yesterday's plan copied");return;}
 if(e.target.closest('[data-reset]')){seen.clear();idx=0;renderSpine();renderRound();return;}
 if(e.target.closest('[data-film]')){toast('Full-screen film viewer · pinch to zoom');return;}
 const ck=e.target.closest('[data-ck]');
 if(ck){const p=view==='work'?null:P[idx];if(p){p.checks[+ck.dataset.ck][2]^=1;renderRound();toast('Milestone updated');}return;}
 if(e.target.closest('[data-close]')){openAdd(false);openPal(false);return;}
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const a=e.target.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='pal'){openPal(true);}
  else if(k==='add'){openAdd(true);}
  else if(k==='present'){openPal(false);prIdx=0;renderPresent();$('#present').classList.add('on');}
  else if(k==='dark'){openPal(false);setTheme(document.documentElement.getAttribute('data-theme')!=='dark');}
  else if(TITLES[k]){openPal(false);go(k);}
  else{openPal(false);toast(a.querySelector('.pi-t')?.textContent||'Done');}
  return;}
 if(e.target.id==='scrim'){openPal(false);openAdd(false);}
 if(e.target.closest('#themeBtn'))setTheme(document.documentElement.getAttribute('data-theme')!=='dark');
 if(e.target.closest('#prExit'))$('#present').classList.remove('on');
 if(e.target.closest('#prNext')){prIdx=(prIdx+1)%P.length;renderPresent();}
 if(e.target.closest('#prPrev')){prIdx=(prIdx-1+P.length)%P.length;renderPresent();}
});
document.addEventListener('input',e=>{
 if(e.target.id==='palIn')renderPal(e.target.value);
 if(e.target.id==='planIn'||e.target.dataset.plan)P[idx].plan=e.target.value;
});
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal(!$('#pal').classList.contains('on'));}
 if(e.key==='Escape'){openPal(false);openAdd(false);$('#present').classList.remove('on');}
 if($('#present').classList.contains('on')){
  if(e.key==='ArrowRight'){prIdx=(prIdx+1)%P.length;renderPresent();}
  if(e.key==='ArrowLeft'){prIdx=(prIdx-1+P.length)%P.length;renderPresent();}}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(view==='round')renderRound();},160);});
renderSpine();renderRound();renderPal();
</script>
</body>
</html>
